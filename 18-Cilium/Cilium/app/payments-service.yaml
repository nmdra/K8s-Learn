apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: bookstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
      tier: backend
  template:
    metadata:
      labels:
        app: payments
        tier: backend
    spec:
      containers:
        - name: payments
          image: hashicorp/http-echo:latest
          args: ["-text=Payments Service"]
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: bookstore
  labels:
    app: payments
spec:
  selector:
    app: payments
  ports:
    - port: 5002
      targetPort: 5678
      name: http
