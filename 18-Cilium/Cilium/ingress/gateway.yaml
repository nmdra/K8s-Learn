apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bookstore-gateway
  namespace: bookstore
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookstore-routes
  namespace: bookstore
spec:
  parentRefs:
    - name: bookstore-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/books
      backendRefs:
        - name: api-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/orders
      backendRefs:
        - name: api-gateway
          port: 8080
