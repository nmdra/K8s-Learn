apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: httpbin-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: httpbin.local
    http:
      paths:
      - path: /http
        pathType: Prefix
        backend:
          service:
            name: httpbin-service
            port:
              number: 80
